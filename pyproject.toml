[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-minecraft-server-maker"
version = "4.1.0"
authors = [
  { name="Toprak Ahmet Aydoğmuş" },
]
description = "Autonomous Minecraft Server Maker, Local 1.5B AI Assistant, Modrinth Auto-Mod Downloader & Crash Diagnostic Suite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
  "minecraft",
  "minecraft-server",
  "forge",
  "fabric",
  "papermc",
  "purpur",
  "modrinth",
  "local-ai",
  "ollama",
  "server-manager"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Systems Administration"
]
dependencies = [
    "customtkinter>=5.2.0",
    "requests>=2.28.0",
    "psutil>=5.9.0",
    "Pillow>=9.0.0",
    "darkdetect>=0.8.0"
]

[project.urls]
"Homepage" = "https://github.com/toprakahmetaydogmus/auto-minecraft-server-maker"
"Bug Tracker" = "https://github.com/toprakahmetaydogmus/auto-minecraft-server-maker/issues"
"Releases" = "https://github.com/toprakahmetaydogmus/auto-minecraft-server-maker/releases"

[project.scripts]
auto-minecraft-server-maker = "main:main"
auto-mc = "main:main"
